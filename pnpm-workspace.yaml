packages:
    - site

allowBuilds:
    '@parcel/watcher': false
    '@swc/core': false
    esbuild: true
    sharp: false
    unrs-resolver: false

# Patched versions of dev-only dependencies with security advisories, until the packages that
# pull them in raise their own ranges. vitepress 1.x asks for vite 5, which has no patched
# release; vite 6 also brings esbuild >= 0.25 instead of 0.21.
overrides:
    'vitepress>vite': ^6.4.4
    '@vitejs/plugin-vue>vite': ^6.4.4
    'fast-uri@<3.1.9': ^3.1.9
    'minimatch@<11.0.1': ^11.0.1
