name: Sources

# Twice a week: fetch the official sources, keep the snapshots on the `sources` branch, rebuild the
# data from them, and open a pull request when the data changed. The other days, the consumer price
# index alone. The data in main only changes through a reviewed pull request.
on:
    schedule:
        # Monday and Thursday, so a source that breaks is noticed within a few days
        - cron: '41 4 * * 1,4'
        # The other days, Statbel's consumer price index alone: a month's index comes out near its
        # end and an indexation of the procedural indemnity takes effect on the first of the next
        # month, so a few days' wait matters. One small request a day.
        - cron: '41 4 * * 0,2,3,5,6'
    workflow_dispatch:
        inputs:
            # One source, or all of them. The options are the sources in scripts/sources/catalog.ts
            # (test/parse/catalog.test.ts keeps them in step)
            sources:
                description: Which sources to fetch
                type: choice
                default: all
                options:
                    - all
                    - courts
                    - prisons
                    - houses-of-justice
                    - statbel
                    - postal-codes
                    - ngi
                    - police-zones
                    - cpi
                    - etaamb

concurrency:
    group: sources
    cancel-in-progress: false

permissions: {}

jobs:
    sources:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            # The pushes below pass their token explicitly; don't leave one in .git/config while
            # the parsers run
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Check out the snapshots
              run: |
                  if git ls-remote --exit-code --heads origin sources >/dev/null; then
                    git fetch --depth=1 origin sources
                    git worktree add .sources FETCH_HEAD
                    git -C .sources switch -c sources
                  else
                    git worktree add --orphan -b sources .sources
                  fi

            # A failed page keeps its last good snapshot and an interrupted walk leaves its
            # source's snapshots as they were, so the run goes on with the other sources: one
            # broken site doesn't hold back every update. The failures are listed in the data
            # pull request, and the last step fails the run so the sources issue says so too.
            - name: Fetch
              id: fetch
              env:
                  ONLY: ${{ github.event.schedule == '41 4 * * 0,2,3,5,6' && 'cpi' || inputs.sources != 'all' && inputs.sources || '' }}
              run: |
                  set -o pipefail
                  # Unquoted on purpose: no argument at all fetches every source
                  # shellcheck disable=SC2086
                  if ! pnpm fetch:sources $ONLY 2>&1 | tee fetch.log; then
                    echo "failed=true" >> "$GITHUB_OUTPUT"
                    grep -E 'snapshots left as they were|: HTTP [0-9]+ ' fetch.log > fetch-failures.log || true
                  fi
                  # A part of a source that can't be read for now keeps its last snapshots: a
                  # warning on the run and a line in the data pull request, not a failure
                  grep 'kept the last snapshots' fetch.log > fetch-kept.log || true
                  while read -r line; do echo "::warning::$line"; done < fetch-kept.log

            - name: Commit the snapshots
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cd .sources
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add -A
                  if git diff --cached --quiet; then
                    echo "No changes"
                  else
                    git commit -q -m "Snapshots of $(date -u +%F)"
                    git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" sources
                  fi

            # Fails, and changes nothing, when a page can't be placed: that needs a person
            - name: Rebuild the data
              id: build
              run: |
                  set -o pipefail
                  pnpm build:data 2>&1 | tee build.log
                  pnpm generate
                  git diff --quiet -- data src/ids.generated.ts schema ids.lock.json || echo "changed=true" >> "$GITHUB_OUTPUT"

            # The cantons come from ejustice, which refuses GitHub's runners (#52), so they're
            # rebuilt by hand. canton-signals.ts says when the other sources show they changed,
            # and annex-amendments.ts when etaamb's copy of the Official Journal has a law that
            # changes the annex.
            - name: Open or update the cantons issue
              # Also after a failed rebuild: the signals are printed before the build stops
              if: always() && steps.build.outcome != 'skipped' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  sed -n 's/^canton signal: //p' build.log > canton-signals.log 2>/dev/null || true
                  [ -s canton-signals.log ] || exit 0
                  # The issue body, or a comment with the signals the open issue doesn't mention yet
                  write() {
                    echo "The sources show that the cantons may have changed: $RUN_URL"
                    echo
                    echo '```'
                    cat "$1"
                    echo '```'
                    echo
                    echo "The cantons and municipalities come from the annex to the Judicial Code on"
                    echo "ejustice, which refuses GitHub's runners. Rebuild them on your own machine and"
                    echo "open a pull request:"
                    echo
                    echo '```'
                    echo 'pnpm build:cantons && pnpm generate'
                    echo '```'
                    # The annex lines aren't settled by a rebuild alone
                    if grep -q '^annex: ' "$1"; then
                      echo
                      echo "An \`annex:\` line names a law that writes about the annex. Read it first: a law"
                      echo "that only cites the annex, or changes another code's, changes no canton. For one"
                      echo "that does, Justel adds it to the annex's text weeks or months after it's published,"
                      echo "and the rebuild prints the date its text is updated to: until that date reaches the"
                      echo "law's publication date the rebuild changes nothing, so keep this issue open and run"
                      echo "it again later. The law leaves the sources run after 60 days; this issue is what"
                      echo "remembers it."
                      echo
                      echo "A line about etaamb itself (nothing published, a page that couldn't be read) needs"
                      echo "no rebuild: look at https://etaamb.openjustice.be/nl/ and at the law it names."
                    fi
                  }
                  gh label create cantons --color 1D76DB --description "The cantons need a rebuild by hand" 2>/dev/null || true
                  number=$(gh issue list --label cantons --state open --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                    # Only what the issue doesn't say yet: the same signals come back every run
                    # until the data catches up
                    gh issue view "$number" --comments --json body,comments --jq '.body, .comments[].body' > seen.txt
                    if grep -vxF -f seen.txt canton-signals.log > new-signals.log; then
                      write new-signals.log > cantons.md
                      gh issue comment "$number" --body-file cantons.md
                    fi
                  else
                    write canton-signals.log > cantons.md
                    gh issue create --title "The cantons may have changed: run pnpm build:cantons" --label cantons --body-file cantons.md
                  fi

            - name: Test the new data
              if: steps.build.outputs.changed == 'true'
              run: |
                  set -o pipefail
                  pnpm typecheck 2>&1 | tee test.log
                  pnpm test 2>&1 | tee -a test.log

            # A token from the repository's GitHub App when it's set up (the BOT_CLIENT_ID variable
            # and the BOT_PRIVATE_KEY secret): a pull request it opens or pushes to starts CI, which
            # one from the workflow's own token doesn't. Without the app, the workflow's token is used.
            - name: Get the bot's token
              id: bot
              if: vars.BOT_CLIENT_ID != '' && steps.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.BOT_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - name: Open or update the data pull request
              if: steps.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
                  BOT: ${{ steps.bot.outcome == 'success' }}
                  # The issue below: the bot's token can only touch contents and pull requests
                  WORKFLOW_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git switch -c data/sources
                  git add data src/ids.generated.ts schema ids.lock.json
                  git commit -q -m "Update the data from the official sources ($(date -u +%F))"
                  git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" data/sources
                  {
                    echo "The fetch of the official sources changed the data: $RUN_URL"
                    echo
                    echo '```'
                    git diff --stat HEAD~1 -- data
                    echo '```'
                    echo
                    if grep -q '^indexation: ' build.log; then
                      echo "**A new indexation of the procedural indemnity is due**, from Statbel's consumer"
                      echo "price index (art. 8 of the KB of 26 October 2007). Check the index on statbel.fgov.be"
                      echo "and the threshold before merging:"
                      echo
                      echo '```'
                      grep -E '^(indexation|cpi): ' build.log
                      echo '```'
                      echo
                    fi
                    echo "What the parsers couldn't read:"
                    echo
                    echo '```'
                    grep '^unreadable' build.log | head -40 || true
                    echo '```'
                    echo
                    if [ -s canton-signals.log ]; then
                      echo "The cantons may have changed (see the cantons issue): run \`pnpm build:cantons\` by hand."
                      echo
                      echo '```'
                      cat canton-signals.log
                      echo '```'
                      echo
                    fi
                    if [ -s fetch-kept.log ]; then
                      echo "Not read this run, so their data is as it was in the last snapshots:"
                      echo
                      echo '```'
                      cat fetch-kept.log
                      echo '```'
                      echo
                    fi
                    if [ -s fetch-failures.log ]; then
                      echo "These sources failed, so their data is as it was in the last good snapshot:"
                      echo
                      echo '```'
                      head -40 fetch-failures.log
                      echo '```'
                      echo
                    fi
                    echo "Review the diff against the sources before merging."
                    if [ "$BOT" != true ]; then
                      echo "Pull requests opened with the workflow's own token don't start CI: the workflow"
                      echo "ran the typecheck and tests above; close and reopen the pull request to run the"
                      echo "full CI, or set up the bot (docs/guide/contributing.md)."
                    fi
                  } > body.md
                  # Without the bot, the workflow's token may not open pull requests: then an issue
                  # says the branch is ready, and later runs update that issue instead of opening
                  # another one
                  open_issue() {
                    export GH_TOKEN="$WORKFLOW_TOKEN"
                    issue=$(gh issue list --label data-update --state open --json number --jq '.[0].number')
                    if [ -n "$issue" ]; then
                      gh issue edit "$issue" --body-file body.md
                      gh issue comment "$issue" --body "Rebuilt from the sources again: $RUN_URL. The description shows the latest run."
                    else
                      gh issue create --title "Data update from the official sources is ready on branch data/sources" --label data-update --body-file body.md
                    fi
                  }
                  number=$(gh pr list --head data/sources --state open --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                    gh pr edit "$number" --body-file body.md
                  else
                    gh pr create --base main --head data/sources --title "Data update from the official sources" --body-file body.md --label data-update \
                      || open_issue
                  fi

            - name: Fail when a source failed
              if: steps.fetch.outputs.failed == 'true'
              run: |
                  echo "::error::Some sources failed; the rest of the data was rebuilt without them"
                  cat fetch-failures.log
                  exit 1

            # A source that failed, or a page the parser can't place: a person needs to look
            - name: Open or update the sources issue
              if: failure() && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -s fetch-failures.log ]; then
                    {
                      echo "Some sources failed in $RUN_URL. Their last good snapshots were kept, and the"
                      echo "rest of the data was rebuilt without them:"
                      echo
                      echo '```'
                      head -40 fetch-failures.log
                      echo '```'
                    } > issue.md
                  else
                    echo "The sources run failed, so the data wasn't rebuilt: $RUN_URL. The parser may have met a page it can't place, or the new data failed its tests." > issue.md
                  fi
                  gh label create data-freshness --color FBCA04 --description "Data may be out of date" 2>/dev/null || true
                  number=$(gh issue list --label data-freshness --state open --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                    gh issue comment "$number" --body-file issue.md
                  else
                    gh issue create --title "Data freshness check needs attention" --label data-freshness --body-file issue.md
                  fi
