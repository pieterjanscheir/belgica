name: Release

# Publishes to npm and PyPI when a push to main changes the version in package.json (merging the pull
# request from the Prepare release workflow, or a version bump by hand), or when a version tag is
# pushed. Uses trusted publishing (OIDC) on both, so no token is stored: link this workflow to the
# package under its settings on npmjs.com, and add it as a trusted publisher on pypi.org (workflow
# release.yml, environment pypi).
#
# The order makes a failed run safe to rerun, with "Re-run all jobs" or by the next push:
# 1. version: the version has no GitHub release yet, and both version files agree at the commit
#    that will be released.
# 2. tag: the release commit is tagged first. Every later job checks out that commit by its SHA,
#    so npm, PyPI and the release zip come from the same commit even when a later push reruns the
#    workflow.
# 3. npm, then pypi: PyPI waits for npm's pnpm check. Each skips a version that's already
#    published.
# 4. release: the GitHub release is created last, so "has a GitHub release" means "is out on npm
#    and PyPI".
on:
    push:
        branches: [main]
        tags: ['v*']

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            sha: ${{ steps.version.outputs.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: false
            - id: version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="v$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match package.json ($tag)"
                      exit 1
                  fi
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "$tag is already released"
                      exit 0
                  fi
                  # A tag made by an earlier, failed run is the release commit: build from it, not
                  # from whatever was pushed since
                  if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2> /dev/null) ||
                      ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                      sha=$GITHUB_SHA
                  fi
                  if [ "$sha" != "$GITHUB_SHA" ]; then
                      git fetch -q --depth=1 origin "$sha"
                      git checkout -q --detach "$sha"
                  fi
                  # Both version files at the commit that will be released, before anything is
                  # published
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$tag" ]; then
                      echo "$tag points at $sha, whose package.json has $version"
                      exit 1
                  fi
                  python_version=$(uv version --short --project python)
                  if [ "$python_version" != "$version" ]; then
                      echo "At $sha, python/pyproject.toml has $python_version, package.json $version"
                      exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"

    tag:
        needs: version
        if: needs.version.outputs.tag != ''
        runs-on: ubuntu-latest
        permissions:
            # write: create the tag
            contents: write
        steps:
            # Through the API: a tag pushed with the workflow's token doesn't start this workflow
            # again
            - name: Tag the release commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.version.outputs.tag }}
                  SHA: ${{ needs.version.outputs.sha }}
              run: |
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
                      echo "$TAG already exists"
                  else
                      gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
                  fi

    npm:
        needs: [version, tag]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            TAG: ${{ needs.version.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.sha }}
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  # What's published is built from a clean install, not from a cache other runs
                  # can write to
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            # On every run, also when the version is already on npm: pypi waits for this job, so
            # the data it publishes has always passed the checks
            - name: Check (what prepublishOnly runs)
              run: pnpm check
            # A version that's already on npm (published by hand, or a rerun) is skipped.
            # --ignore-scripts: prepublishOnly would run pnpm check a second time; the build is
            # part of the check above, and there's no other publish script.
            - name: Publish to npm
              run: |
                  spec="$(node -p "require('./package.json').name")@${TAG#v}"
                  if npm view "$spec" version > /dev/null 2>&1; then
                      echo "$spec is already on npm; not publishing it again"
                  else
                      npm publish --provenance --access public --ignore-scripts
                  fi

    # The same version to PyPI, from the same commit, once npm is out: the npm job runs pnpm check
    # (the data's tests too) on that commit, and a version on PyPI can't be replaced. CI runs the
    # Python tests.
    pypi:
        needs: [version, tag, npm]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.sha }}
                  persist-credentials: false
            # No cache: a release build shouldn't restore what another run saved
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: false
            # The build copies data/ in
            - run: uv build
              working-directory: python
            # skip-existing: a rerun doesn't fail on a version that's already on PyPI
            - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  packages-dir: python/dist
                  skip-existing: true

    # Last: only once npm and PyPI both have the version
    release:
        needs: [version, npm, pypi]
        runs-on: ubuntu-latest
        permissions:
            # write: create the GitHub release
            contents: write
        env:
            TAG: ${{ needs.version.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.sha }}
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            # The release assets and notes are built in a step of their own, without the token:
            # the repository's scripts and tools run here, and the token is only handed to gh
            # below
            - name: Build the release assets
              # The data as JSON and CSV, with the schemas and the data package descriptor, for
              # people who don't use npm. build:data-files writes the generated data/courts/ and
              # data/cantons/ files, which are only there after a build.
              run: |
                  pnpm build:data-files
                  pnpm build:csv
                  name="belgica-data-$TAG"
                  mkdir "$name"
                  cp -r data schema datapackage.json LICENSE-DATA csv "$name"/
                  zip -qr "$name.zip" "$name"
                  # The notes: this version's section of CHANGELOG.md, then GitHub's list of the
                  # pull requests and the full diff
                  awk -v heading="## [${TAG#v}]" '
                      index($0, heading) == 1 { found = 1; next }
                      found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
                      found { print }
                  ' CHANGELOG.md > notes.md
                  # One line per paragraph: a release keeps single line breaks
                  pnpm exec prettier --prose-wrap never --write notes.md
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$TAG" --verify-tag --notes-file notes.md --generate-notes "belgica-data-$TAG.zip"
