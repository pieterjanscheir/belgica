name: Release

# Publishes to npm and PyPI when a push to main changes the version in package.json (merging the pull
# request from the Prepare release workflow, or a version bump by hand), or when a version tag is
# pushed. It tags the release commit, publishes, and creates the GitHub release. Uses trusted
# publishing (OIDC) on both, so no token is stored: link this workflow to the package under its
# settings on npmjs.com, and add it as a trusted publisher on pypi.org (workflow release.yml,
# environment pypi).
on:
    push:
        branches: [main]
        tags: ['v*']

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Which tag to release, if any: on main, the package.json version until it has a GitHub
    # release. Every step below skips what's already done, so a failed run can be rerun.
    version:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - id: version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="v$(node -p "require('./package.json').version")"
                  if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match package.json ($tag)"
                      exit 1
                  fi
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "$tag is already released"
                  else
                      echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  fi

    publish:
        needs: version
        if: needs.version.outputs.tag != ''
        runs-on: ubuntu-latest
        permissions:
            # write: create the tag and the GitHub release
            contents: write
            id-token: write
        env:
            TAG: ${{ needs.version.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  # What's published is built from a clean install, not from a cache other runs
                  # can write to
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            # prepublishOnly runs pnpm check. A version that's already on npm (published by hand,
            # or a rerun) is skipped, so the tag and the GitHub release below still get made.
            - name: Publish to npm
              run: |
                  spec="$(node -p "require('./package.json').name")@${TAG#v}"
                  if npm view "$spec" version > /dev/null 2>&1; then
                      echo "$spec is already on npm; not publishing it again"
                  else
                      npm publish --provenance --access public
                  fi
            # Through the API: a tag pushed with the workflow's token doesn't start this workflow
            # again
            - name: Tag the release commit
              if: github.ref_type == 'branch'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
                      echo "$TAG already exists"
                  else
                      gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
                  fi
            # The release assets and notes are built in a step of their own, without the token:
            # the repository's scripts and tools run here, and the token is only handed to gh
            # below
            - name: Build the release assets
              # The data as JSON and CSV, with the schemas and the data package descriptor, for
              # people who don't use npm
              run: |
                  pnpm build:csv
                  name="belgica-data-$TAG"
                  mkdir "$name"
                  cp -r data schema datapackage.json LICENSE-DATA csv "$name"/
                  zip -qr "$name.zip" "$name"
                  # The notes: this version's section of CHANGELOG.md, then GitHub's list of the
                  # pull requests and the full diff
                  awk -v heading="## [${TAG#v}]" '
                      index($0, heading) == 1 { found = 1; next }
                      found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
                      found { print }
                  ' CHANGELOG.md > notes.md
                  # One line per paragraph: a release keeps single line breaks
                  pnpm exec prettier --prose-wrap never --write notes.md
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$TAG" --verify-tag --notes-file notes.md --generate-notes "belgica-data-$TAG.zip"

    # The same version to PyPI. The npm job has run pnpm check on the same commit, and CI the
    # Python tests.
    pypi:
        needs: [version, publish]
        if: needs.version.outputs.tag != ''
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: read
            id-token: write
        env:
            TAG: ${{ needs.version.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # No cache: a release build shouldn't restore what another run saved
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: false
            - name: Check the tag matches pyproject.toml
              run: |
                  version=$(uv version --short --project python)
                  if [ "v$version" != "$TAG" ]; then
                      echo "Tag $TAG doesn't match version $version in python/pyproject.toml"
                      exit 1
                  fi
            # The build copies data/ in
            - run: uv build
              working-directory: python
            # skip-existing: a rerun doesn't fail on a version that's already on PyPI
            - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                  packages-dir: python/dist
                  skip-existing: true
