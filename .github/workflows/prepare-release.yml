name: Prepare release

# Run it from the Actions tab: it raises the version, moves the Unreleased section of
# CHANGELOG.md under it (scripts/prepare-release.ts) and opens the release pull request. Merging
# that pull request publishes the release (release.yml). The changelog stays hand-written: add
# to Unreleased as changes land.
#
# Opening the pull request needs the bot's token (docs/guide/contributing.md) or the repository
# setting "Allow GitHub Actions to create and approve pull requests". With neither, the branch
# is still pushed and the run ends with a link that opens the pull request in one click.
on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version to raise, by the id rules in CHANGELOG.md'
                type: choice
                options: [patch, minor, major]
                required: true

permissions: {}

concurrency:
    group: prepare-release
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - name: Raise the version
              id: version
              env:
                  BUMP: ${{ inputs.bump }}
              run: echo "version=$(node scripts/prepare-release.ts "$BUMP")" >> "$GITHUB_OUTPUT"
            # A token from the repository's GitHub App when it's set up (the BOT_CLIENT_ID variable
            # and the BOT_PRIVATE_KEY secret): a pull request it opens or pushes to starts CI, which
            # one from the workflow's own token doesn't. Without the app, the workflow's token is used.
            - name: Get the bot's token
              id: bot
              # The app may be set up but not installed on the repository (a 404): fall back to the
              # workflow's token instead of stopping the run
              continue-on-error: true
              if: vars.BOT_CLIENT_ID != ''
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.BOT_CLIENT_ID }}
                  private-key: ${{ secrets.BOT_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - name: Open the release pull request
              env:
                  GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
                  BOT: ${{ steps.bot.outcome == 'success' }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git switch -c "release/v$VERSION"
                  git commit -q -am "Release $VERSION"
                  git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "release/v$VERSION"
                  {
                    echo "Moves the Unreleased changes under $VERSION. Merging this pull request publishes"
                    echo "$VERSION to npm and PyPI and creates the GitHub release."
                    if [ "$BOT" != true ]; then
                      echo
                      echo "Pull requests opened with the workflow's own token don't start CI: close and"
                      echo "reopen this one to run it, or set up the bot (docs/guide/contributing.md)."
                    fi
                  } > body.md
                  if gh pr create --base main --head "release/v$VERSION" --title "Release $VERSION" --body-file body.md 2> pr.err; then
                    exit 0
                  fi
                  cat pr.err >&2
                  # The branch is pushed either way. The workflow's own token may only open a pull
                  # request when the repository allows it: say so, and give the link that opens it
                  # with one click, instead of a bare failure
                  if grep -q 'not permitted to create or approve pull requests' pr.err; then
                    link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release/v$VERSION?quick_pull=1&title=Release%20$VERSION"
                    echo "::error title=The release branch is pushed, but this workflow may not open its pull request::Open it yourself: $link . To let the workflow open it, turn on Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests, or set up the bot (docs/guide/contributing.md)."
                    {
                      echo "## The branch \`release/v$VERSION\` is pushed, but the pull request isn't open"
                      echo
                      echo "This repository doesn't let GitHub Actions open pull requests."
                      echo
                      echo "- **Now**: [open the pull request]($link) and merge it to publish $VERSION."
                      echo "  Opened by you, it starts CI."
                      echo "- **For next time**, one of:"
                      echo "  - Settings → Actions → General → Workflow permissions → **Allow GitHub Actions to"
                      echo "    create and approve pull requests**. The pull request then opens by itself, but"
                      echo "    without CI: close and reopen it to run CI."
                      echo "  - Set up the bot (\`docs/guide/contributing.md\`). The pull request opens by itself"
                      echo "    and CI runs."
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit 1
